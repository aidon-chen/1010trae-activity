<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IronSpirit 抽奖转盘</title>
<style>
  :root{
    --bg:#0e1117;
    --card:#161a23;
    --line:#262c39;
    --fg:#e8eaee;
    --dim:#98a0b0;
    --accent:#3b82f6;
    --warn:#f5a524;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{
    background:radial-gradient(1200px 700px at 50% -10%,#1b2233 0%,var(--bg) 60%);
    color:var(--fg);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  }
  .app{max-width:1180px;margin:0 auto;padding:20px 16px 40px}
  header{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:16px}
  header h1{font-size:20px;margin:0;letter-spacing:.5px}
  header .sub{color:var(--dim);font-size:13px}

  main{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:28px;align-items:start}

  /* ---------- 转盘 ---------- */
  .stage{position:relative;width:100%;max-width:560px;margin:0 auto;aspect-ratio:1}
  #wheel{width:100%;height:100%;display:block;filter:drop-shadow(0 18px 40px rgba(0,0,0,.55))}
  .pointer{
    position:absolute;left:50%;top:-2px;transform:translateX(-50%);
    width:0;height:0;border-left:16px solid transparent;border-right:16px solid transparent;
    border-top:34px solid #f5d90a;filter:drop-shadow(0 3px 6px rgba(0,0,0,.6));z-index:3;
  }
  #spin{
    position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    width:26%;aspect-ratio:1;border-radius:50%;border:0;cursor:pointer;
    background:linear-gradient(160deg,#f5f7fa,#c7cdd8);color:#12151c;
    font-size:clamp(15px,2.6vw,20px);font-weight:800;letter-spacing:2px;
    box-shadow:0 6px 20px rgba(0,0,0,.5),inset 0 -3px 0 rgba(0,0,0,.18);
    z-index:4;transition:transform .12s;
  }
  #spin:active{transform:translate(-50%,-50%) scale(.95)}
  #spin:disabled{opacity:.45;cursor:not-allowed}

  /* ---------- 结果 ---------- */
  .result{
    margin:22px auto 0;max-width:560px;text-align:center;
    background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:16px 18px;min-height:84px;display:flex;flex-direction:column;justify-content:center;
  }
  .result .lv{font-size:12px;letter-spacing:3px;color:var(--dim)}
  .result .name{font-size:clamp(22px,4vw,30px);font-weight:800;margin-top:6px}
  .result.empty .name{font-size:16px;font-weight:500;color:var(--dim)}

  /* ---------- 面板 ---------- */
  aside{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
  .totals{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
  .totals div{background:#1d2230;border-radius:10px;padding:10px 12px}
  .totals .k{font-size:12px;color:var(--dim)}
  .totals .v{font-size:22px;font-weight:800;margin-top:2px}
  aside h2{font-size:13px;color:var(--dim);font-weight:600;margin:0 0 10px;letter-spacing:1px}
  ul.stock{list-style:none;margin:0;padding:0}
  ul.stock li{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid #1e2431;font-size:14px}
  ul.stock li:last-child{border-bottom:0}
  ul.stock li .dot{width:9px;height:9px;border-radius:2px;flex:none}
  ul.stock li .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  ul.stock li .rm{font-variant-numeric:tabular-nums;font-weight:700}
  ul.stock li .pb{font-variant-numeric:tabular-nums;color:var(--dim);font-size:12px;width:52px;text-align:right}
  ul.stock li.out{opacity:.38}

  .btn{
    padding:10px 12px;border-radius:10px;cursor:pointer;font-size:13px;
    background:transparent;border:1px solid var(--line);color:var(--dim);
  }
  .btn:hover{border-color:#3a4356;color:var(--fg)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
  .btn.primary:hover{background:#2f74e0}
  .btn.wide{width:100%;margin-top:12px}

  /* ---------- 参数设置 ---------- */
  .admin{margin-top:26px;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
  .admin-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;cursor:pointer}
  .admin-head h2{margin:0;font-size:14px;font-weight:600;letter-spacing:.5px}
  .admin-head .hint{font-size:12px;color:var(--dim);margin-left:10px;font-weight:400}
  .admin-body{padding:0 16px 16px;border-top:1px solid var(--line)}
  .grid-head,.prow{display:grid;grid-template-columns:minmax(0,1fr) 104px 84px 46px 32px;gap:8px;align-items:center}
  .grid-head{padding:12px 0 6px;font-size:12px;color:var(--dim)}
  .prow{padding:4px 0}
  .prow input{
    width:100%;background:#1d2230;border:1px solid var(--line);border-radius:8px;
    color:var(--fg);font-size:13px;padding:8px;font-family:inherit;
  }
  .prow input:focus{outline:0;border-color:var(--accent)}
  .prow input[type=number]{font-variant-numeric:tabular-nums}
  .prow input[type=color]{padding:2px;height:34px;cursor:pointer}
  .prow .del{background:transparent;border:0;color:var(--dim);cursor:pointer;font-size:15px}
  .prow .del:hover{color:#e5484d}
  .admin-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:14px}
  .admin-actions .sum{font-size:13px;color:var(--dim);margin-left:auto}
  .admin-actions .sum b{color:var(--fg);font-variant-numeric:tabular-nums}
  .admin-actions .sum.bad b{color:var(--warn)}

  @media (max-width:880px){
    main{grid-template-columns:1fr;gap:20px}
    aside{order:2}
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>IronSpirit 抽奖转盘</h1>
    <span class="sub" id="sub">不放回 · 抽完即止</span>
  </header>

  <main>
    <section>
      <div class="stage">
        <div class="pointer"></div>
        <canvas id="wheel"></canvas>
        <button id="spin">抽奖</button>
      </div>
      <div class="result empty" id="result"><div class="name">点击中间按钮开始抽奖</div></div>
    </section>

    <aside>
      <div class="totals">
        <div><div class="k">剩余奖签</div><div class="v" id="tRemain">0</div></div>
        <div><div class="k">已抽次数</div><div class="v" id="tDrawn">0</div></div>
      </div>
      <h2>各品类剩余 / 当前概率</h2>
      <ul class="stock" id="stock"></ul>
      <button class="btn wide" id="reset">重置奖池</button>
    </aside>
  </main>

  <section class="admin">
    <div class="admin-head" id="adminHead">
      <h2>参数设置<span class="hint">管理人员可修改奖项名称、等级、数量与颜色</span></h2>
      <button class="btn" id="toggleAdmin" type="button">展开</button>
    </div>
    <div class="admin-body" id="adminBody" hidden>
      <div class="grid-head">
        <span>奖项名称</span><span>等级</span><span>数量</span><span>颜色</span><span></span>
      </div>
      <div id="rows"></div>
      <div class="admin-actions">
        <button class="btn" id="addRow" type="button">+ 新增奖项</button>
        <button class="btn primary" id="apply" type="button">保存并重制奖池</button>
        <span class="sum" id="sumHint"></span>
      </div>
    </div>
  </section>
</div>

<script>
/* 默认奖项配置（数量之和即全场奖签总数，默认 200） */
const DEFAULT_PRIZES = [
  { name:'单肩背包',   level:'特等奖', count:2,   color:'#e5484d' },
  { name:'马克杯',     level:'一等奖', count:5,   color:'#f5a524' },
  { name:'笔记本',     level:'一等奖', count:3,   color:'#f5d90a' },
  { name:'TRAE宝手办', level:'二等奖', count:4,   color:'#30a46c' },
  { name:'徽章',       level:'二等奖', count:2,   color:'#12a594' },
  { name:'钥匙扣',     level:'二等奖', count:2,   color:'#0d74ce' },
  { name:'冰箱贴',     level:'三等奖', count:15,  color:'#8e4ec6' },
  { name:'谢谢参与',   level:'',       count:167, color:'#333947' }
];
const PALETTE = ['#e5484d','#f5a524','#f5d90a','#30a46c','#12a594','#0d74ce','#8e4ec6','#e93d82','#46a758','#978365'];

const PARAM_KEY = 'ironspirit_wheel_params_v1';
const STORE_KEY = 'ironspirit_wheel_v1';

const canvas   = document.getElementById('wheel');
const ctx      = canvas.getContext('2d');
const spinBtn  = document.getElementById('spin');
const resultEl = document.getElementById('result');
const stockEl  = document.getElementById('stock');
const tRemain  = document.getElementById('tRemain');
const tDrawn   = document.getElementById('tDrawn');
const rowsEl   = document.getElementById('rows');
const sumHint  = document.getElementById('sumHint');
const subEl    = document.getElementById('sub');

let PRIZES = loadParams();
let state  = { deck: [], drawn: [] };   // deck：剩余奖签（已洗牌）；drawn：已抽记录
let rotation = 0;                       // 转盘当前角度（顺时针，度）
let spinning = false;

/* ---------- 参数存取 ---------- */
function loadParams(){
  try{
    const raw = localStorage.getItem(PARAM_KEY);
    if (raw){
      const arr = JSON.parse(raw);
      if (Array.isArray(arr) && arr.length) return arr.map(normalize);
    }
  }catch(e){}
  return DEFAULT_PRIZES.map(normalize);
}
function normalize(p){
  return {
    name : String(p.name ?? '').trim() || '未命名',
    level: String(p.level ?? '').trim(),
    count: Math.max(0, parseInt(p.count, 10) || 0),
    color: /^#[0-9a-fA-F]{6}$/.test(p.color) ? p.color : '#8e4ec6'
  };
}
function saveParams(){
  try{ localStorage.setItem(PARAM_KEY, JSON.stringify(PRIZES)); }catch(e){}
}
function totalTickets(){ return PRIZES.reduce((s,p) => s + p.count, 0); }

/* ---------- 奖池 ---------- */
function buildDeck(){
  const d = [];
  PRIZES.forEach(p => { for (let i = 0; i < p.count; i++) d.push(p.name); });
  // Fisher-Yates：奖签充分混匀
  for (let i = d.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [d[i], d[j]] = [d[j], d[i]];
  }
  return d;
}
function saveState(){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }catch(e){}
}
function loadState(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if (!raw) return false;
    const s = JSON.parse(raw);
    if (!Array.isArray(s.deck) || !Array.isArray(s.drawn)) return false;
    state = s;
    return true;
  }catch(e){ return false; }
}
/* 用名称作为奖签标识；参数变动后旧奖池作废 */
function stateMatchesParams(){
  const names = new Set(PRIZES.map(p => p.name));
  return state.deck.every(n => names.has(n)) && state.drawn.every(n => names.has(n));
}
function rebuildDeck(){
  state = { deck: buildDeck(), drawn: [] };
  saveState();
  clearResult();
  renderStock();
}

/* ---------- 绘制 ---------- */
function render(){
  const w = canvas.width, h = canvas.height;
  const cx = w / 2, cy = h / 2;
  const R = Math.min(w, h) / 2 - 4;
  const n = PRIZES.length;

  ctx.clearRect(0, 0, w, h);
  if (n === 0){
    ctx.fillStyle = '#1d2230';
    ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI * 2); ctx.fill();
    return;
  }

  const seg = 2 * Math.PI / n;
  const start0 = -Math.PI / 2;            // 0° 指向正上方，与指针一致
  const rad = rotation * Math.PI / 180;

  for (let i = 0; i < n; i++){
    const p = PRIZES[i];
    const a1 = start0 + i * seg + rad;
    const a2 = a1 + seg;

    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.arc(cx, cy, R, a1, a2);
    ctx.closePath();
    ctx.fillStyle = p.color;
    ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,.28)';
    ctx.lineWidth = Math.max(1, R * 0.006);
    ctx.stroke();

    // 文字沿半径方向排布
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(a1 + seg / 2);
    ctx.textAlign = 'right';
    ctx.textBaseline = 'middle';
    const dark = isDark(p.color);
    const fg = dark ? '#ffffff' : '#12151c';
    if (p.level){
      ctx.font = `${Math.round(R * 0.055)}px sans-serif`;
      ctx.globalAlpha = .78;
      ctx.fillStyle = fg;
      ctx.fillText(p.level, R * 0.88, -R * 0.075);
      ctx.globalAlpha = 1;
    }
    ctx.font = `700 ${Math.round(R * 0.078)}px sans-serif`;
    ctx.fillStyle = fg;
    ctx.fillText(p.name, R * 0.88, p.level ? R * 0.045 : 0);
    ctx.restore();
  }

  ctx.beginPath();
  ctx.arc(cx, cy, R, 0, Math.PI * 2);
  ctx.strokeStyle = '#f5d90a';
  ctx.lineWidth = Math.max(2, R * 0.022);
  ctx.stroke();
}
function isDark(hex){
  const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  return (0.299*r + 0.587*g + 0.114*b) < 150;
}
function fitCanvas(){
  const rect = canvas.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  canvas.width  = Math.max(1, Math.round(rect.width  * dpr));
  canvas.height = Math.max(1, Math.round(rect.height * dpr));
  render();
}

/* ---------- 面板 ---------- */
function remainingMap(){
  const m = {};
  PRIZES.forEach(p => m[p.name] = 0);
  state.deck.forEach(n => { if (m[n] !== undefined) m[n]++; });
  return m;
}
function clearResult(){
  resultEl.className = 'result empty';
  resultEl.innerHTML = '<div class="name">点击中间按钮开始抽奖</div>';
}
function renderStock(){
  const m = remainingMap();
  const left = state.deck.length;
  const total = totalTickets();

  tRemain.textContent = left;
  tDrawn.textContent  = state.drawn.length;
  subEl.textContent   = `${total} 张奖签 · 不放回 · 抽完即止`;

  stockEl.innerHTML = '';
  PRIZES.forEach(p => {
    const rm = m[p.name];
    // 当前概率 = 该品类剩余签数 / 剩余总签数，每抽一次都会变化
    const pb = left > 0 ? (rm / left * 100) : 0;
    const li = document.createElement('li');
    if (rm === 0) li.className = 'out';
    li.innerHTML = `<span class="dot" style="background:${p.color}"></span>
      <span class="nm">${escapeHtml(p.name)}</span>
      <span class="rm">${rm}</span>
      <span class="pb">${pb.toFixed(1)}%</span>`;
    stockEl.appendChild(li);
  });

  const empty = left === 0;
  spinBtn.disabled = empty || spinning || total === 0;
  if (total === 0){
    resultEl.className = 'result empty';
    resultEl.innerHTML = '<div class="name">奖池为空，请先在下方设置奖项数量</div>';
  } else if (empty){
    resultEl.className = 'result empty';
    resultEl.innerHTML = '<div class="name">奖签已全部抽完</div>';
  }
}
function escapeHtml(s){
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ---------- 抽奖 ---------- */
function animateTo(target, dur){
  const from = rotation, t0 = performance.now();
  return new Promise(resolve => {
    function frame(t){
      const k = Math.min(1, (t - t0) / dur);
      const e = 1 - Math.pow(1 - k, 3);           // easeOutCubic
      rotation = from + (target - from) * e;
      render();
      k < 1 ? requestAnimationFrame(frame) : resolve();
    }
    requestAnimationFrame(frame);
  });
}

async function spin(){
  if (spinning || state.deck.length === 0 || PRIZES.length === 0) return;

  spinning = true;
  spinBtn.disabled = true;

  // 不放回：先定中奖奖签，再从奖池移除
  const name = state.deck.pop();
  state.drawn.push(name);
  saveState();

  const idx = PRIZES.findIndex(p => p.name === name);
  if (idx < 0){ spinning = false; renderStock(); return; }
  const p = PRIZES[idx];

  const segDeg = 360 / PRIZES.length;
  // 指针在正上方：让该扇区中心停到指针处；jitter 保证落点在扇区内而非压线
  const jitter  = (Math.random() * 2 - 1) * (segDeg * 0.33);
  const wantMod = ((-(idx * segDeg + segDeg / 2) + jitter) % 360 + 360) % 360;
  const curMod  = ((rotation % 360) + 360) % 360;
  const target  = rotation + 360 * 6 + ((wantMod - curMod) + 360) % 360;

  await animateTo(target, 4200);

  resultEl.className = 'result';
  resultEl.innerHTML =
    (p.level ? `<div class="lv">${escapeHtml(p.level)}</div>` : '') +
    `<div class="name" style="color:${p.color}">${escapeHtml(p.name)}</div>`;

  spinning = false;
  renderStock();
}

/* ---------- 参数设置 UI ---------- */
function renderRows(){
  rowsEl.innerHTML = '';
  PRIZES.forEach((p, i) => rowsEl.appendChild(makeRow(p, i)));
  updateSum();
}
function makeRow(p, i){
  const row = document.createElement('div');
  row.className = 'prow';
  row.innerHTML =
    `<input class="c-name"  type="text"   value="${escapeHtml(p.name)}"  placeholder="奖项名称">
     <input class="c-level" type="text"   value="${escapeHtml(p.level)}" placeholder="如 一等奖">
     <input class="c-count" type="number" min="0" step="1" value="${p.count}">
     <input class="c-color" type="color"  value="${p.color}">
     <button class="del" type="button" title="删除">✕</button>`;
  row.querySelector('.del').addEventListener('click', () => {
    if (PRIZES.length <= 1){ alert('至少保留一个奖项'); return; }
    collectRows();
    PRIZES.splice(i, 1);
    renderRows();
  });
  row.querySelectorAll('input').forEach(el => el.addEventListener('input', () => { collectRows(); updateSum(); }));
  return row;
}
/* 把表格里的草稿读回 PRIZES（未保存到 localStorage） */
function collectRows(){
  const list = [];
  rowsEl.querySelectorAll('.prow').forEach(row => {
    list.push(normalize({
      name : row.querySelector('.c-name').value,
      level: row.querySelector('.c-level').value,
      count: row.querySelector('.c-count').value,
      color: row.querySelector('.c-color').value
    }));
  });
  if (list.length) PRIZES = list;
}
function updateSum(){
  const total = totalTickets();
  sumHint.className = 'sum' + (total === 0 ? ' bad' : '');
  sumHint.innerHTML = total === 0 ? '合计 <b>0</b> 张' : `合计 <b>${total}</b> 张奖签`;
}

/* ---------- 事件 ---------- */
spinBtn.addEventListener('click', spin);

document.getElementById('reset').addEventListener('click', () => {
  if (spinning) return;
  if (!confirm(`重置奖池？将按当前参数重新生成 ${totalTickets()} 张奖签并清空已抽记录。`)) return;
  rebuildDeck();
});

document.getElementById('toggleAdmin').addEventListener('click', () => {
  const body = document.getElementById('adminBody');
  body.hidden = !body.hidden;
  document.getElementById('toggleAdmin').textContent = body.hidden ? '展开' : '收起';
});
document.getElementById('adminHead').addEventListener('click', (e) => {
  if (e.target.closest('#toggleAdmin')) return;
  document.getElementById('toggleAdmin').click();
});

document.getElementById('addRow').addEventListener('click', () => {
  collectRows();
  PRIZES.push({ name:'新奖项', level:'', count:1, color: PALETTE[PRIZES.length % PALETTE.length] });
  renderRows();
});

document.getElementById('apply').addEventListener('click', () => {
  if (spinning) return;
  collectRows();
  if (!PRIZES.length || totalTickets() === 0){ alert('请至少设置一个数量大于 0 的奖项'); return; }
  if (!confirm(`保存参数并重制奖池？将生成 ${totalTickets()} 张奖签并清空已抽记录。`)) return;
  saveParams();
  rebuildDeck();
  renderRows();
});

window.addEventListener('resize', fitCanvas);

/* ---------- 初始化 ---------- */
if (!loadState() || !stateMatchesParams() || state.deck.length + state.drawn.length !== totalTickets()){
  state = { deck: buildDeck(), drawn: [] };
  saveState();
}
renderRows();
fitCanvas();
renderStock();
</script>
</body>
</html>
