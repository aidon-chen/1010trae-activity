<!DOCTYPE html>
<html lang="zh-CN"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>幸运转盘 · 本地活动服务</title>
<style>
  :root{
    /* TraeWork 浅色主题 + 活动氛围感 */
    --bg:#ffffff;
    --bg-soft:#f5f5f5;
    --card:#ffffff;
    --line: rgba(115,115,115,0.12);
    --line-strong: rgba(115,115,115,0.18);
    --fg:#171717;
    --fg-2:#404040;
    --dim:#737373;
    --accent:#4b3fe3;
    --accent-hover:#6a6fff;
    --accent-soft:rgba(75,63,227,0.08);
    --accent-soft-border:rgba(75,63,227,0.15);
    --warn:#e27900;
    --success:#0f9960;
    --error:#d9363f;
    --radius-4: 4px; --radius-6: 6px; --radius-10: 10px;
    --radius-8: 8px;
    --radius-12: 12px;
    --radius-16: 16px;
    --radius-20: 20px;
    --radius-24: 24px;
    --shadow-sm: 0 1px 2px rgba(23,23,23,0.04);
    --shadow-md: 0 4px 12px rgba(23,23,23,0.06);
    --shadow-brand: 0 4px 16px rgba(75,63,227,0.25);
    --shadow-brand-lg: 0 8px 28px rgba(75,63,227,0.3);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{
    color:var(--fg);
    font-family:"SF Pro Text", "PingFang SC", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    position:relative;
  }
  /* 品牌背景氛围 */
  .bg-atmosphere{
    position:fixed;inset:0;z-index:-1;overflow:hidden;
    background:linear-gradient(180deg,#F5F3FF 0%,#FFFFFF 40%,#FFFFFF 100%);
  }
  .bg-blob{position:absolute;border-radius:50%;filter:blur(80px);opacity:0.5}
  .bg-blob-1{width:480px;height:480px;top:-180px;left:-120px;background:rgba(75,63,227,0.18)}
  .bg-blob-2{width:360px;height:360px;top:80px;right:-100px;background:rgba(139,92,246,0.15)}
  .bg-blob-3{width:400px;height:400px;bottom:-150px;left:30%;background:rgba(99,102,241,0.1)}
  .bg-grid{
    position:absolute;inset:0;
    background-image:
      linear-gradient(rgba(75,63,227,0.03) 1px,transparent 1px),
      linear-gradient(90deg,rgba(75,63,227,0.03) 1px,transparent 1px);
    background-size:40px 40px;
    mask-image:radial-gradient(ellipse at top,#000 30%,transparent 70%);
    -webkit-mask-image:radial-gradient(ellipse at top,#000 30%,transparent 70%);
  }
  .app{max-width:1180px;margin:0 auto;padding:20px 16px 40px;position:relative;z-index:1}

  /* 顶部导航 */
  .top-nav{
    display:flex;align-items:center;justify-content:space-between;
    height:44px;margin-bottom:16px;
  }
  .top-nav__back{
    display:inline-flex;align-items:center;gap:4px;
    font-size:13px;color:var(--fg-2);
    padding:6px 10px;border-radius:8px;
    transition:background .2s,color .2s;
  }
  .top-nav__back:hover{background:var(--bg-soft);color:var(--fg)}
  .top-nav__brand{
    display:flex;align-items:center;gap:6px;
    font-size:14px;font-weight:600;color:var(--fg);
  }
  header{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:20px;margin-top:16px}
  header h1{
    font-size:clamp(24px,4vw,32px);margin:0;letter-spacing:-.02em;font-weight:700;line-height:1.2;
    background:linear-gradient(135deg,#171717 0%,#4B3FE3 100%);
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  }
  header .sub{color:var(--dim);font-size:14px}

  main{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:28px;align-items:start}
  main > section:first-child{margin-top:20px}

  /* ---------- 转盘 ---------- */
  .stage{position:relative;width:100%;max-width:640px;margin:0 auto}
  .stage::before{content:"";display:block;padding-top:100%}
  #wheel{
    position:absolute;top:0;left:0;width:100%;height:100%;display:block;
    filter:drop-shadow(0 12px 32px rgba(75,63,227,0.15));
  }
  .pointer{
    position:absolute;left:50%;top:-2px;transform:translateX(-50%);
    width:0;height:0;border-left:18px solid transparent;border-right:18px solid transparent;
    border-top:38px solid var(--accent);
    filter:drop-shadow(0 4px 10px rgba(75,63,227,0.4));
    z-index:3;
  }
  #spin{
    position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    width:26%;aspect-ratio:1;border-radius:50%;border:0;cursor:pointer;
    background:var(--accent);
    color:#fff;
    font-size:clamp(15px,2.6vw,20px);font-weight:600;letter-spacing:1px;
    box-shadow:var(--shadow-brand-lg);
    z-index:4;transition:transform .15s ease,background .2s ease,box-shadow .2s ease;
  }
  #spin:hover{background:var(--accent-hover);box-shadow:0 10px 32px rgba(75,63,227,0.4)}
  #spin:active{transform:translate(-50%,-50%) scale(.95)}
  #spin:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}

  /* ---------- 结果 ---------- */
  .result{
    margin:22px auto 0;max-width:640px;text-align:center;
    background:rgba(255,255,255,0.6);
    backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
    border:1px solid rgba(255,255,255,0.5);
    box-shadow:0 8px 32px rgba(75,63,227,0.1);
    border-radius:var(--radius-20);
    padding:20px 24px;min-height:88px;display:flex;flex-direction:column;justify-content:center;
  }
  .result .lv{font-size:12px;letter-spacing:2px;color:var(--dim);font-weight:500}
  .result .name{
    font-size:clamp(22px,4vw,30px);font-weight:700;margin-top:6px;
    background:linear-gradient(135deg,#171717 0%,#4B3FE3 100%);
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  }
  .result.empty .name{
    font-size:16px;font-weight:500;
    background:none;-webkit-text-fill-color:var(--dim);color:var(--dim);
  }

  /* ---------- 面板 ---------- */
  aside{
    background:rgba(255,255,255,0.7);
    backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    border:1px solid var(--line);border-radius:var(--radius-20);
    padding:20px;
    box-shadow:var(--shadow-sm);
  }
  .totals{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
  .totals > div{
    background:var(--accent-soft);
    border:1px solid var(--accent-soft-border);
    border-radius:var(--radius-12);padding:14px;
  }
  .totals .k{font-size:12px;color:var(--dim)}
  /* 第 3 张卡片（总中奖概率）独占一行 */
  .totals > div:nth-child(3){grid-column:1/-1}
  .totals .v{
    font-size:28px;font-weight:700;margin-top:4px;
    font-family:"Inter","SF Pro Text",sans-serif;font-variant-numeric:tabular-nums;
    background:linear-gradient(135deg,#171717 0%,#4B3FE3 100%);
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  }
  aside h2{
    font-size:12px;color:var(--dim);font-weight:500;
    margin:0 0 12px;letter-spacing:.5px;text-transform:uppercase;
  }
  ul.stock{list-style:none;margin:0;padding:0}
  ul.stock li{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
  ul.stock li:last-child{border-bottom:0}
  ul.stock li .dot{width:10px;height:10px;border-radius:3px;flex:none;box-shadow:0 1px 2px rgba(0,0,0,0.1)}
  ul.stock li .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--fg-2)}
  ul.stock li .rm{font-variant-numeric:tabular-nums;font-weight:600;color:var(--fg)}
  ul.stock li .pb{font-variant-numeric:tabular-nums;color:var(--dim);font-size:12px;width:52px;text-align:right}
  ul.stock li.out{opacity:.4}

  .btn{
    padding:10px 16px;border-radius:var(--radius-10);cursor:pointer;font-size:13px;
    background:var(--card);border:1px solid var(--line-strong);color:var(--fg-2);
    font-family:inherit;transition:all .2s ease;font-weight:500;
  }
  .btn:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
  .btn.primary{
    background:linear-gradient(135deg,#4B3FE3 0%,#6366F1 100%);
    border-color:transparent;color:#fff;font-weight:600;
    box-shadow:var(--shadow-brand);
  }
  .btn.primary:hover{box-shadow:0 6px 20px rgba(75,63,227,0.35)}
  .btn.wide{width:100%;margin-top:14px}

  /* ---------- 参数设置 ---------- */
  .admin{
    margin-top:28px;
    background:rgba(255,255,255,0.7);
    backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    border:1px solid var(--line);border-radius:var(--radius-20);
    overflow:hidden;box-shadow:var(--shadow-sm);
  }
  .admin-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;cursor:pointer}
  .admin-head h2{margin:0;font-size:15px;font-weight:600;letter-spacing:.2px}
  .admin-head .hint{font-size:12px;color:var(--dim);margin-left:10px;font-weight:400}
  .admin-body{padding:0 20px 20px;border-top:1px solid var(--line)}
  .grid-head,.prow{display:grid;grid-template-columns:minmax(0,1fr) 104px 84px 46px 32px;gap:10px;align-items:center}
  .grid-head{padding:14px 0 6px;font-size:12px;color:var(--dim)}
  .prow{padding:6px 0}
  .prow input{
    width:100%;background:var(--bg-soft);border:1px solid var(--line);border-radius:var(--radius-8);
    color:var(--fg);font-size:13px;padding:9px 10px;font-family:inherit;transition:border-color .2s,box-shadow .2s;
  }
  .prow input:focus{outline:0;border-color:var(--accent);box-shadow:0 0 0 3px rgba(75,63,227,0.1)}
  .prow input[type=number]{font-variant-numeric:tabular-nums}
  .prow input[type=color]{padding:3px;height:38px;cursor:pointer;background:transparent;border-radius:var(--radius-6)}
  .prow .del{background:transparent;border:0;color:var(--dim);cursor:pointer;font-size:16px;transition:color .2s}
  .prow .del:hover{color:var(--error)}
  .admin-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:16px}
  .admin-actions .sum{font-size:13px;color:var(--dim);margin-left:auto}
  .admin-actions .sum b{color:var(--fg);font-variant-numeric:tabular-nums;font-weight:600}
  .admin-actions .sum.bad b{color:var(--warn)}

  @media (max-width:880px){
    main{grid-template-columns:1fr;gap:20px}
    aside{order:2}
  }
  @media (prefers-reduced-motion:reduce){
    *{transition:none!important;animation:none!important}
  }
  [hidden]{display:none!important}
  a.btn{text-decoration:none;display:inline-block}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .service-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;color:var(--success);font-size:13px}
  .offline{color:var(--error)}
  .notice{border:1px solid var(--accent-soft-border);background:#f5f3ff;border-radius:16px;padding:16px;margin:0 0 18px}
  .notice p{margin:0;font-size:14px;line-height:1.7}
  .stock-note{color:var(--dim);font-size:12px;line-height:1.7;margin:14px 0 0}
  .history-title{margin-top:22px}
  .history{padding:0;margin:0;list-style:none;font-size:12px}
  .history li{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:8px 0;border-bottom:1px solid var(--line);color:var(--dim)}
  .history strong{color:var(--fg-2);font-weight:500}
  .result .lv{letter-spacing:1px;line-height:1.6}
  @media(max-width:540px){.grid-head,.prow{grid-template-columns:minmax(0,1fr) 78px 58px 36px 22px;gap:5px}.prow input{padding:8px 5px}.admin-head .hint{display:block;margin:6px 0 0;line-height:1.6}.top-nav__brand{font-size:12px}.top-nav>span{display:none}.service-bar{font-size:12px}.service-bar .btn{white-space:nowrap}.admin-body{padding:0 12px 16px}}
</style>
</head>
<body>
<!-- 品牌背景氛围 -->
<div class="bg-atmosphere" aria-hidden="true">
  <div class="bg-grid"></div>
  <div class="bg-blob bg-blob-1"></div>
  <div class="bg-blob bg-blob-2"></div>
  <div class="bg-blob bg-blob-3"></div>
</div>
<div class="app">
  <!-- 顶部导航 -->
  <nav class="top-nav">
    <a href="index.html" class="top-nav__back">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 18l-6-6 6-6"></path></svg>
      返回活动主页
    </a>
    <div class="top-nav__brand">
      <svg width="18" height="18" viewBox="0 0 16 16" fill="currentColor" style="color:#4b3fe3"><path d="M14.7992 12.6749H3.14192V10.8059H1.19922V3.3255H14.7992V12.6749ZM3.14192 10.8059H12.8565V5.19535H3.14192V10.8059ZM7.99968 7.97209L6.62597 9.2942L5.25235 7.97209L6.62597 6.64989L7.99968 7.97209ZM11.8852 7.97128L10.5115 9.29339L9.13783 7.97128L10.5115 6.64909L11.8852 7.97128Z"></path></svg>
      <span>Trae · 幸运转盘</span>
    </div>
    <span style="width:92px"></span>
  </nav>
  <header>
    <h1>幸运大转盘</h1>
    <div class="sub" id="sub">200 张奖签 · 不放回 · 抽完即止</div>
  </header>

  <div class="service-bar"><span id="serviceStatus" role="status">正在连接本地服务…</span><button class="btn" id="manage" type="button">管理奖池</button></div>
  <section id="legacyNotice" class="notice" hidden>
    <p id="legacyMessage"></p>
    <div class="admin-actions"><button class="btn" id="exportLegacy">导出旧缓存备份</button><button class="btn primary" id="importLegacy">迁移旧记录并继续</button><button class="btn" id="keepNew">核对后使用服务器奖池</button></div>
  </section>
  <main>
    <section style="position: relative;">
      <div class="stage">
        <div class="pointer"></div>
        <canvas id="wheel" width="1280" height="1280"></canvas>
        <button id="spin" disabled>抽奖</button>
      </div>
      <div class="result empty" id="result" role="status" aria-live="polite"><div class="name">正在连接本地服务…</div></div>
    </section>

    <aside style="position: relative;">
      <div class="totals">
        <div><div class="k">剩余奖签</div><div class="v" id="tRemain">—</div></div>
        <div><div class="k">已抽次数</div><div class="v" id="tDrawn">—</div></div>
        <div><div class="k">总中奖概率</div><div class="v" id="tWinRate" style="position: relative;">—</div></div>
      </div>
      <h2>各品类剩余 / 当前概率</h2>
      <ul class="stock" id="stock"><li>正在连接本地服务…</li></ul>
      <p class="stock-note">扇区用于展示，实际概率按剩余奖签计算。</p>
      <h2 class="history-title">最近抽奖记录</h2><ul class="history" id="history"><li>暂无记录</li></ul>
      <button class="btn wide" id="reset" hidden style="position: relative;">按文档新建奖池</button>
    </aside>
  </main>

  <section class="admin" hidden="">
    <div class="admin-head" id="adminHead" style="position: relative;">
      <h2>参数设置<span class="hint">旧奖池与记录保留；请核对实物库存后新建</span></h2>
      <button class="btn" id="toggleAdmin" type="button">展开</button>
    </div>
    <div class="admin-body" id="adminBody" hidden="">
      <div class="grid-head">
        <span>奖项名称</span><span>等级</span><span>数量</span><span>颜色</span><span></span>
      </div>
      <div id="rows"></div><div class="admin-actions">
        <button class="btn" id="addRow" type="button">+ 新增奖项</button>
        <button class="btn primary" id="apply" type="button">保存为新奖池</button>
        <span class="sum" id="sumHint">合计 <b>200</b> 张奖签</span>
      </div>
      <div class="admin-actions"><a class="btn" href="/api/export.csv" download>导出全部抽奖记录</a><button class="btn" id="backup" type="button">备份数据库</button></div>
      <p class="stock-note">按 Ctrl + Shift + A 也可打开管理区。服务仅限本机，管理区供现场操作人员使用。新建奖池会切换库存，历史记录全部保留。</p>
    </div>
  </section>
</div>

<script src="wheel.js" defer></script>









</body></html>
